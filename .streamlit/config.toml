[server]
headless = true
# The app serves charts only; nothing under static/ is published.
enableStaticServing = false

[client]
# Hide the developer menu (rerun, settings, source) and tracebacks from visitors.
toolbarMode = "viewer"
showErrorDetails = "none"

[browser]
gatherUsageStats = false

# Con un tema claro y uno oscuro, cada visitante ve el modo de su dispositivo y puede
# cambiarlo en el menú ⋮ → Settings. Un [theme] solo sería siempre claro.
[theme.light]
primaryColor = "#2a9d8f"

[theme.dark]
primaryColor = "#2a9d8f"
