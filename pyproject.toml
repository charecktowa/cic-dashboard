[project]
name = "cic-dashboard"
version = "0.1.0"
description = "El CIC en datos: tablero público de la investigación del CIC para estudiantes"
readme = "README.md"
authors = [
    { name = "A. Gutiérrez Alfaro", email = "charecktowa@pm.me" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "plotly>=7.1.0",
    "polars>=2.0.0",
    "streamlit>=1.66.1",
]

[dependency-groups]
dev = [
    "bandit[toml]>=1.9.4",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9",
    "ruff>=0.17.2",
]
# Solo la máquina que construye la instantánea habla con Postgres y clasifica el idioma
# de cada título; el VPS no instala ninguno de los dos.
export = [
    "lingua-language-detector>=2.1",
    "psycopg[binary]>=3.3.6",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "PD"]

[tool.ruff.lint.isort]
# Explícito: la detección automática depende del directorio desde donde corre ruff.
known-first-party = ["advisor", "common", "export", "openalex", "text", "views"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["^\\.venv/"]

[[tool.mypy.overrides]]
# El código propio siempre debe resolverse; nunca debe volverse `Any` en silencio.
module = ["advisor", "common", "export", "openalex", "text"]
ignore_missing_imports = false

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
# Las pruebas importan los módulos desde la raíz del proyecto.
pythonpath = ["."]
addopts = ["--import-mode=importlib", "-ra"]
strict = true
